image boot.vfat {
	vfat {
		files = {
			"boot.bin",
			"u-boot.itb",
			"qspi.bin",
			"system.dtb",
			"Image",
			"rootfs.cpio.uboot"
		}
		file extlinux/extlinux.conf {
			image = extlinux.conf
		}
	}

	size = 128M
}

image sdcard.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}
}
