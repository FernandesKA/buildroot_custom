# /etc/watchdog.conf — pets the Zynq-7000 PS SWDT (cadence watchdog).
# U-Boot arms the watchdog before booting the kernel and this daemon takes
# over once userspace starts. A boot that hangs before the daemon runs is
# reset by the watchdog, which increments U-Boot's bootcount and eventually
# rolls back to the previous A/B slot.

watchdog-device		= /dev/watchdog
# 180 s gives enough margin for slow SD-card writes during an OTA; the daemon
# still pings every 'interval' seconds.
watchdog-timeout	= 180
interval		= 10
realtime		= yes
priority		= 1
