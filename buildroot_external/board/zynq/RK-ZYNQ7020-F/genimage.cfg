image boot.vfat {
	vfat {
		files = {
			"boot.bin",
			"u-boot.img",
			"system.dtb",
			"boot.scr",
			"uboot.env",
			"uboot-redund.env"
		}
	}

	size = 32M
}

image sdcard.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs-a {
		partition-type = 0x83
		image = "rootfs.ext4"
	}

	partition rootfs-b {
		partition-type = 0x83
		image = "rootfs.ext4"
	}

	partition data {
		partition-type = 0x83
		image = "data.ext4"
	}
}
