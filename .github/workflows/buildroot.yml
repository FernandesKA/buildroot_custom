name: Build Buildroot Zynq RK7020F
on:
  push:
    branches: ["main", "beaglebone_support"]
    tags:
      - "v*"
  workflow_dispatch:
env:
  DL_DIR: /opt/buildroot-cache/dl
  CCACHE_DIR: /opt/buildroot-cache/ccache
jobs:
  changes:
    name: Detect changed platforms
    runs-on: ubuntu-latest
    outputs:
      common: ${{ steps.filter.outputs.common }}
      rk7020f: ${{ steps.filter.outputs.rk7020f }}
      zcu106: ${{ steps.filter.outputs.zcu106 }}
      zcu106_ram: ${{ steps.filter.outputs.zcu106_ram }}
      beaglebone: ${{ steps.filter.outputs.beaglebone }}
      rk7020f_ad: ${{ steps.filter.outputs.rk7020f_ad }}
      adrv9002: ${{ steps.filter.outputs.adrv9002 }}
      raspberrypi4: ${{ steps.filter.outputs.raspberrypi4 }}
      qemu_x86_64: ${{ steps.filter.outputs.qemu_x86_64 }}
      pluto_sky: ${{ steps.filter.outputs.pluto_sky }}
      rk7020f_iqforge: ${{ steps.filter.outputs.rk7020f_iqforge }}
      sipeed_m1s: ${{ steps.filter.outputs.sipeed_m1s }}
      sipeed_m1s_ext: ${{ steps.filter.outputs.sipeed_m1s_ext }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            common:
              - '.github/workflows/buildroot.yml'
              - 'buildroot'
              - 'buildroot_external/Config.in'
              - 'buildroot_external/external.mk'
              - 'buildroot_external/package/**'
              - 'buildroot_external/boot/**'
            rk7020f:
              - 'buildroot_external/configs/zynq_rk7020f_defconfig'
              - 'buildroot_external/board/zynq/RK-ZYNQ7020-F/**'
            zcu106:
              - 'buildroot_external/configs/zynqmp_zcu106_defconfig'
              - 'buildroot_external/board/zynqmp/zcu106_custom/**'
            zcu106_ram:
              - 'buildroot_external/configs/zynqmp_zcu106_ram_defconfig'
              - 'buildroot_external/board/zynqmp/zcu106_custom/**'
            beaglebone:
              - 'buildroot_external/configs/beaglebone_defconfig'
              - 'buildroot_external/board/beagleboard/beaglebone/**'
            rk7020f_ad:
              - 'buildroot_external/configs/zynq_rk7020f_ad_defconfig'
              - 'buildroot_external/board/zynq/RK-ZYNQ7020-F-AD/**'
            adrv9002:
              - 'buildroot_external/configs/zynq_adrv9002_defconfig'
              - 'buildroot_external/board/zynq/adrv9002/**'
            raspberrypi4:
              - 'buildroot_external/configs/raspberrypi4_custom_defconfig'
              - 'buildroot_external/board/raspberrypi4_custom/**'
            qemu_x86_64:
              - 'buildroot_external/configs/qemu_x86_64_defconfig'
              - 'buildroot_external/board/qemu/**'
            pluto_sky:
              - 'buildroot_external/configs/zynq_pluto_sky_defconfig'
              - 'buildroot_external/board/zynq/pluto_sky/**'
            rk7020f_iqforge:
              - 'buildroot_external/configs/zynq_rk7020f_iqforge_defconfig'
              - 'buildroot_external/board/zynq/RK-ZYNQ7020-F-IQFORGE/**'
            sipeed_m1s:
              - 'buildroot_external/configs/sipeed_m1s_defconfig'
              - 'buildroot_external/board/sipeed/m1s/**'
            sipeed_m1s_ext:
              - 'buildroot_external/configs/sipeed_m1s_ext_defconfig'
              - 'buildroot_external/board/sipeed/m1s/**'

  build-rk7020f:
    needs: changes
    runs-on: self-hosted
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      needs.changes.outputs.common == 'true' ||
      needs.changes.outputs.rk7020f == 'true'
    env:
      OUTPUT_DIR: output_rk7020f
      DEFCONFIG: zynq_rk7020f_defconfig
      ARTIFACT_NAME: zynq-rk7020f-images
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Prepare cache directories
        run: |
          mkdir -p $DL_DIR $CCACHE_DIR
          echo "max_size = 10G" > "$CCACHE_DIR/ccache.conf"
      - name: Set environment paths
        run: |
          echo "WORKSPACE_ROOT=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "BUILDROOT_DIR=$GITHUB_WORKSPACE/buildroot" >> $GITHUB_ENV
          echo "BR2_EXTERNAL=$GITHUB_WORKSPACE/buildroot_external" >> $GITHUB_ENV
      - name: Sanity check
        run: |
          echo "=== WORKSPACE ==="
          ls -lah $WORKSPACE_ROOT
          echo "=== BUILDROOT ==="
          ls -lah $BUILDROOT_DIR
          echo "=== EXTERNAL ==="
          ls -lah $BR2_EXTERNAL
          echo "=== DL CACHE ==="
          du -sh $DL_DIR || true
          echo "=== CCACHE STATS ==="
          ccache --show-stats || true
      - name: Configure Buildroot
        working-directory: ${{ env.BUILDROOT_DIR }}
        run: |
          make \
            O=${{ env.OUTPUT_DIR }} \
            BR2_EXTERNAL=$BR2_EXTERNAL \
            ${{ env.DEFCONFIG }}
      - name: Apply cache config overrides
        working-directory: ${{ env.BUILDROOT_DIR }}/${{ env.OUTPUT_DIR }}
        run: |
          cat >> .config <<EOF
          BR2_DL_DIR="$DL_DIR"
          BR2_CCACHE=y
          BR2_CCACHE_DIR="$CCACHE_DIR"
          EOF
          make -C ${{ env.BUILDROOT_DIR }} O=${{ env.OUTPUT_DIR }} olddefconfig
      - name: Build
        working-directory: ${{ env.BUILDROOT_DIR }}
        run: |
          make O=${{ env.OUTPUT_DIR }} -j$(nproc)
      - name: Build SDK
        working-directory: ${{ env.BUILDROOT_DIR }}
        run: |
          make O=${{ env.OUTPUT_DIR }} sdk
      - name: Rename artifacts
        run: |
          IMG=buildroot/${{ env.OUTPUT_DIR }}/images/sdcard.img
          if [ -f "$IMG" ]; then
            mv "$IMG" "buildroot/${{ env.OUTPUT_DIR }}/images/sdcard-rk7020f.img"
          fi
          SDK=$(ls buildroot/${{ env.OUTPUT_DIR }}/images/*_sdk-*.tar.gz 2>/dev/null | head -n1)
          if [ -n "$SDK" ]; then
            mv "$SDK" "${SDK%.tar.gz}-rk7020f.tar.gz"
          fi
      - name: Show artifacts
        run: |
          ls -lah ${{ env.BUILDROOT_DIR }}/${{ env.OUTPUT_DIR }}/images || true
      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            buildroot/${{ env.OUTPUT_DIR }}/images/sdcard-rk7020f.img
            buildroot/${{ env.OUTPUT_DIR }}/images/*_sdk-*.tar.gz
      - name: Clean output directory
        if: always()
        run: |
          rm -rf ${{ env.BUILDROOT_DIR }}/${{ env.OUTPUT_DIR }}

