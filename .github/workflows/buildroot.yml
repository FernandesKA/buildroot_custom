  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-rk7020f, build-zcu106, build-zcu106-ram, build-beaglebone, build-rk7020f-ad, build-adrv9002, build-raspberrypi4, build-qemu-x86_64, build-pluto-sky, build-rk7020f-iqforge, build-sipeed-m1s, build-sipeed-m1s-ext]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download rk7020f artifacts
        uses: actions/download-artifact@v4
        with:
          name: zynq-rk7020f-images
          path: artifacts/rk7020f
      - name: Download zcu106 artifacts
        uses: actions/download-artifact@v4
        with:
          name: zynqmp-zcu106-images
          path: artifacts/zcu106
      - name: Download zcu106-ram artifacts
        uses: actions/download-artifact@v4
        with:
          name: zynqmp-zcu106-ram-images
          path: artifacts/zcu106-ram
      - name: Download beaglebone artifacts
        uses: actions/download-artifact@v4
        with:
          name: beaglebone-images
          path: artifacts/beaglebone
      - name: Download rk7020f-ad artifacts
        uses: actions/download-artifact@v4
        with:
          name: zynq-rk7020f-ad-images
          path: artifacts/rk7020f-ad
      - name: Download adrv9002 artifacts
        uses: actions/download-artifact@v4
        with:
          name: zynq-adrv9002-images
          path: artifacts/adrv9002
      - name: Download raspberrypi4 artifacts
        uses: actions/download-artifact@v4
        with:
          name: raspberrypi4-custom-images
          path: artifacts/raspberrypi4
      - name: Download qemu-x86_64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: qemu-x86_64-images
          path: artifacts/qemu-x86_64
      - name: Download pluto-sky artifacts
        uses: actions/download-artifact@v4
        with:
          name: zynq-pluto-sky-images
          path: artifacts/pluto-sky
      - name: Download rk7020f-iqforge artifacts
        uses: actions/download-artifact@v4
        with:
          name: zynq-rk7020f-iqforge-images
          path: artifacts/rk7020f-iqforge
      - name: Download sipeed-m1s artifacts
        uses: actions/download-artifact@v4
        with:
          name: sipeed-m1s-images
          path: artifacts/sipeed-m1s
      - name: Download sipeed-m1s-ext artifacts
        uses: actions/download-artifact@v4
        with:
          name: sipeed-m1s-ext-images
          path: artifacts/sipeed-m1s-ext
      - name: Show downloaded files
        run: find artifacts -type f | sort
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          generate_release_notes: true
          files: artifacts/**/*
